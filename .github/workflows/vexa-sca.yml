name: Vexa SCA Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vexa-sca-scan:
    name: Vexa SCA Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and install Vexa SCA CLI
        run: |
          git clone --depth 1 https://github.com/noviqtechnologies/vexa-sca.git /tmp/vexa-sca
          cargo build --locked --release --manifest-path /tmp/vexa-sca/Cargo.toml
          sudo cp /tmp/vexa-sca/target/release/vexa-sca /usr/local/bin/vexa-sca
          rm -rf /tmp/vexa-sca

      - name: Run Vexa SCA Scan
        run: |
          vexa-sca scan . \
            --fail-on high \
            --html-file vexa-report.html \
            --sarif-file vexa-report.sarif \
            --sbom cyclonedx \
            --sbom-file vexa-sbom.cdx.json

      - name: Archive Scan Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexa-sca-reports
          path: |
            vexa-sca-report.html
            vexa-sca-report.sarif
            vexa-sca-sbom.cdx.json
