name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  # ── 1. Clean Reproducibility Job (No Cache) ──────────────────────────────────
  clean-reproducibility:
    name: Clean Container Validation (No Cache)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Print Exact Toolchain Versions
        run: |
          echo "=== Pinned Toolchain Diagnostics ==="
          rustc --version
          cargo --version

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Linter (Deny Warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Binary from Scratch
        run: cargo build --workspace --release --locked

      - name: Full Test Suite
        run: cargo test --workspace --release --all-targets --locked

  # ── 2. Multi-OS Matrix with Caching Optimization ─────────────────────────────
  test-matrix:
    name: Test Matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Print Toolchain Versions
        shell: bash
        run: |
          echo "=== Toolchain Versions ==="
          rustc --version
          cargo --version

      - name: Cache dependencies (Optimization only)
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy linter
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run all tests
        run: cargo test --workspace --all-targets --locked

      - name: Build workspace
        run: cargo build --workspace --release --locked
