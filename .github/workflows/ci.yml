name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  # ── 1. Clean Reproducibility Job (No Cache) ──────────────────────────────────
  clean-reproducibility:
    name: Clean Container Validation (No Cache)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Print Exact Toolchain Versions
        run: |
          echo "=== Pinned Toolchain Diagnostics ==="
          rustc --version
          cargo --version

      - name: Verify Version & Release Manifest Consistency
        run: |
          CARGO_VER=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          NPM_VER=$(node -p 'require("./npm/package.json").version')
          if [ "$CARGO_VER" != "$NPM_VER" ]; then
            echo "::error::Version mismatch: Cargo.toml ($CARGO_VER) != npm/package.json ($NPM_VER)"
            exit 1
          fi

      - name: Run Action & Installer Security Regression Tests
        run: |
          npm --prefix npm ci --ignore-scripts
          node .github/actions/comment-pr.test.js

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Linter (Deny Warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Binary from Scratch
        run: cargo build --workspace --release --locked

      - name: Full Test Suite
        run: cargo test --workspace --release --all-targets --locked

  # ── 2. Multi-OS Matrix with Caching Optimization ─────────────────────────────
  test-matrix:
    name: Test Matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Print Toolchain Versions
        shell: bash
        run: |
          echo "=== Toolchain Versions ==="
          rustc --version
          cargo --version

      - name: Cache dependencies (Optimization only)
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        continue-on-error: true

      - name: Run Action & Installer Security Regression Tests
        run: |
          npm --prefix npm ci --ignore-scripts
          node .github/actions/comment-pr.test.js

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy linter
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run all tests
        run: cargo test --workspace --all-targets --locked

      - name: Build workspace
        run: cargo build --workspace --release --locked
