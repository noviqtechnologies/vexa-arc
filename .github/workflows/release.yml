name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release-gate:
    name: Mandatory Release Gate (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Verify Tag, Cargo.toml, and npm/package.json Version Alignment
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          CARGO_VER=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          NPM_VER=$(node -p 'require("./npm/package.json").version')
          if [ "$CARGO_VER" != "$NPM_VER" ]; then
            echo "::error::Version mismatch: Cargo.toml ($CARGO_VER) != npm/package.json ($NPM_VER)"
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$CARGO_VER" ]; then
            echo "::error::Tag mismatch: pushed tag ($REF_NAME) != v$CARGO_VER"
            exit 1
          fi

      - name: Run Action & Installer Security Regression Tests
        run: node .github/actions/comment-pr.test.js

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Linter (Deny Warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Suite Validation
        run: cargo test --workspace --all-targets --locked

  build:
    name: Build and Package
    needs: [release-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch_name: linux-x86_64
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            arch_name: linux-aarch64
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            arch_name: macos-x86_64
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            arch_name: macos-aarch64
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch_name: windows-x86_64
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep -m 1 "^version = " Cargo.toml | cut -d '"' -f 2)
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Cross (Pinned)
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build binary (Cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build binary (Cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Prepare Release Directory
        shell: bash
        run: |
          mkdir -p release/bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/arc.exe release/bin/
          else
            cp target/${{ matrix.target }}/release/arc release/bin/
          fi
          cp README.md release/

      - name: Create Zip (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd release
          zip -r ../vexa-arc-${{ env.VERSION }}-${{ matrix.arch_name }}.zip .

      - name: Create Zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path release\* -DestinationPath vexa-arc-${{ env.VERSION }}-${{ matrix.arch_name }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: vexa-arc-${{ matrix.arch_name }}
          path: vexa-arc-${{ env.VERSION }}-${{ matrix.arch_name }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep -m 1 "^version = " Cargo.toml | cut -d '"' -f 2)
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Download Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
          pattern: vexa-arc-*

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Generate Syft SBOM for Artifacts
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          path: ./artifacts
          format: spdx-json
          output-file: artifacts/vexa-arc-sbom.spdx.json
          upload-release-assets: false

      - name: Generate Checksums Manifest (SHA-256 & SHA-512)
        shell: bash
        run: |
          cd artifacts
          echo "# SHA-256 Digests" > checksums.txt
          find . -type f \( -name "*.zip" -o -name "*.tgz" \) -exec sha256sum {} + | sed 's|./[^/]*/||' >> checksums.txt
          echo "" >> checksums.txt
          echo "# SHA-512 Digests" >> checksums.txt
          find . -type f \( -name "*.zip" -o -name "*.tgz" \) -exec sha512sum {} + | sed 's|./[^/]*/||' >> checksums.txt
          echo "Generated checksums.txt:"
          cat checksums.txt

      - name: Sign Checksums with Cosign (Keyless - Fail-Closed)
        shell: bash
        run: |
          SIGNED=0
          for i in 1 2 3; do
            if cosign sign-blob --yes \
              --bundle artifacts/checksums.txt.bundle \
              artifacts/checksums.txt; then
              SIGNED=1
              break
            fi
            echo "Retrying cosign sign-blob in 5s (attempt $i/3)..."
            sleep 5
          done
          if [ "$SIGNED" -ne 1 ]; then
            echo "::error::Cryptographic signing with Cosign failed. Failing release gate closed."
            exit 1
          fi

      - name: Sign Checksums with Pinned Ed25519 Release Key (Zero-Dependency Verifier)
        shell: bash
        env:
          VEXA_RELEASE_SIGNING_KEY_PEM: ${{ secrets.VEXA_RELEASE_SIGNING_KEY_PEM }}
        run: |
          if [ -z "${VEXA_RELEASE_SIGNING_KEY_PEM:-}" ]; then
            echo "VEXA_RELEASE_SIGNING_KEY_PEM not configured; skipping optional Ed25519 signing."
            exit 0
          fi
          printf '%s\n' "$VEXA_RELEASE_SIGNING_KEY_PEM" > /tmp/vexa-release-key.pem
          chmod 600 /tmp/vexa-release-key.pem
          openssl pkeyutl -sign -inkey /tmp/vexa-release-key.pem \
            -rawin -in artifacts/checksums.txt -out artifacts/checksums.txt.ed25519.sig
          rm -f /tmp/vexa-release-key.pem

      - name: Generate SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/**/*.zip

      - name: Extract Release Notes from CHANGELOG.md
        shell: bash
        run: |
          VER="${VERSION#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="## [${VER}]" '
              index($0, ver) == 1 { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "Vexa Arc ${VERSION} release." > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.VERSION }}
          name: Vexa Arc ${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            artifacts/**/*.zip
            artifacts/checksums.txt*
            artifacts/vexa-arc-sbom.spdx.json
          generate_release_notes: true
          # Releases are immutable: never overwrite already-published release assets
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release:
    name: Smoke-Test Published Release (${{ matrix.os }})
    needs: [release]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Extract version
        shell: bash
        run: |
          VERSION=$(grep -m 1 "^version = " Cargo.toml | cut -d '"' -f 2)
          echo "VERSION=v$VERSION" >> "$GITHUB_ENV"
          echo "RAW_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify live GitHub Release assets & npm launcher cold/cached execution
        shell: bash
        env:
          ARC_VERSION: ${{ env.VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SMOKE_CACHE="$(mktemp -d)"
          export XDG_CACHE_HOME="$SMOKE_CACHE"
          export LOCALAPPDATA="$SMOKE_CACHE"

          # Cold download + SHA-256 + SLSA provenance verification + extract + execute
          OUT1="$(node npm/bin/arc.js --version)"
          echo "Cold run output: $OUT1"
          echo "$OUT1" | grep -F "$RAW_VERSION"

          # Warm cache hit + cached binary SHA-256 re-verification
          OUT2="$(node npm/bin/arc.js --version)"
          echo "Cached run output: $OUT2"
          echo "$OUT2" | grep -F "$RAW_VERSION"

          rm -rf "$SMOKE_CACHE"

  publish-npm:
    name: Publish @vexasec/arc to npm
    needs: [release, verify-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @vexasec/arc to npm (if NPM_TOKEN configured)
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
